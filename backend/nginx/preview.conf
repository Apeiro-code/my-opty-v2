# Preview proxy: one origin for the whole site, so the browser never needs CORS
# and the images can be built with NEXT_PUBLIC_API_BASE_URL empty.
#
# Mounted read-only as the default server by backend/compose.prod.yaml.

server {
    listen 80;
    server_name _;

    # The API surface from README (`/api/...`), plus the docs and health endpoints
    # the skeleton already serves. A `proxy_pass` without a URI passes the request
    # path through unchanged, so no rewriting happens here.
    location ~ ^/(api(/|$)|actuator|swagger|v3/api-docs) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the storefront.
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
