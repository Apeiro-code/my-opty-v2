spring:
  application:
    name: myopty-api

  # The single local .env lives at the repository root, one level above this module.
  # `.env` is KEY=VALUE, which is also valid properties syntax, so the `[.properties]`
  # hint lets Spring read it directly instead of needing a dotenv dependency. Both paths
  # are optional so a build without a .env (CI) still starts.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: myopty-pool
      maximum-pool-size: 10

  flyway:
    # Flyway is the only thing permitted to write DDL. Migrations from every module land
    # on one classpath, so they are ordered by the version bands in CONTRIBUTING.md.
    enabled: ${DB_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    # The bands are allocated per module and filled in parallel, so a catalog V8 can be
    # written after order's V105 has already run on a teammate's database. Without this,
    # every existing database rejects the newer-but-lower migration and the only fix is
    # dropping the volume. Fresh databases (CI, tests, `compose down -v`) are unaffected:
    # they still apply everything in version order.
    out-of-order: true

  jackson:
    default-property-inclusion: non_null

  # The container's ceiling on an uploaded request, set just above order's own
  # 10MB document cap (myopty.object-storage.max-file-size). A file between the
  # two gets order's INVALID_DOCUMENT answer in the error envelope; one over this
  # line is stopped by Tomcat before the controller, which is the behaviour wanted
  # for a request so large it should never have been read into memory. This is
  # app-wide because multipart parsing happens before any module sees the request,
  # and only the runnable module's application.yml is the one on the classpath.
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

  # Outbound mail, read from the MAIL_* contract in .env. Locally those point at
  # Mailpit (compose service), which accepts any credentials and shows every
  # message at http://localhost:8025 — so auth and STARTTLS are off by default
  # and must be flipped explicitly when a real SMTP provider is configured
  # (docs/DEPLOYMENT.md). JavaMail does not infer auth from a non-blank
  # username, which is why MAIL_SMTP_AUTH exists rather than being assumed.
  # The defaults mirror Mailpit's ports so a test without .env still resolves
  # (same contract as CORS_ALLOWED_ORIGINS below: a fresh clone must boot).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: 8080
  error:
    include-message: always
  servlet:
    session:
      cookie:
        # The session cookie's security posture, stated once here:
        # http-only keeps scripts from reading it, and same-site=lax means a
        # cross-site POST never carries it — which is what makes disabling CSRF
        # tokens defensible (see SecurityConfig's class comment).
        http-only: true
        same-site: lax

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

myopty:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # Payment gateway credentials, read from the PAYMENT_GATEWAY_* contract in .env.
  # `fake` needs no credentials and must never leave a developer's machine;
  # `payhere` requires the sandbox values from docs/DEPLOYMENT.md. The properties
  # class fails startup on a provider it does not know or on missing credentials,
  # so a bad .env shows up here rather than at checkout.
  payment:
    provider: ${PAYMENT_GATEWAY_PROVIDER:fake}
    merchant-id: ${PAYMENT_GATEWAY_MERCHANT_ID:}
    secret-key: ${PAYMENT_GATEWAY_SECRET_KEY:}
    api-version: ${PAYMENT_GATEWAY_API_VERSION:}
    sandbox: ${PAYMENT_GATEWAY_SANDBOX:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: ${LOG_LEVEL:info}