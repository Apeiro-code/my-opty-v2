spring:
  application:
    name: myopty-api

  # The single local .env lives at the repository root, one level above this module.
  # `.env` is KEY=VALUE, which is also valid properties syntax, so the `[.properties]`
  # hint lets Spring read it directly instead of needing a dotenv dependency. Both paths
  # are optional so a build without a .env (CI) still starts.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: myopty-pool
      maximum-pool-size: 10

  flyway:
    # Flyway is the only thing permitted to write DDL. Migrations from every module land
    # on one classpath, so they are ordered by the version bands in CONTRIBUTING.md.
    enabled: ${DB_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

myopty:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: ${LOG_LEVEL:info}